services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tudimedia
      POSTGRES_USER: tudimedia
      POSTGRES_PASSWORD: tudimedia-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tudimedia"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local-only
    volumes: [minio-data:/data]
    ports: ["9001:9001"]
  api:
    build:
      context: ../../services/api
    env_file: ../../.env
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
  migrate:
    build:
      context: ../../services/api
    command: ["node", "db/migrate.js"]
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
  media-worker:
    build:
      context: ../../services/api
    command: ["node", "src/media-worker.js"]
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
  ai-worker:
    build:
      context: ../../services/api
    command: ["node", "src/ai-worker.js"]
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
  operations-worker:
    build: { context: ../../services/api }
    command: ["node", "src/operations-worker.js"]
    env_file: ../../.env
    depends_on: { postgres: { condition: service_healthy } }
  notification-worker:
    build: { context: ../../services/api }
    command: ["node", "src/notification-worker-entry.js"]
    env_file: ../../.env
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  postgres-data:
  minio-data:
