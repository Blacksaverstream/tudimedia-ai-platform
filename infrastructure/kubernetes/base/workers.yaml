apiVersion: apps/v1
kind: Deployment
metadata: { name: media-worker, namespace: tudimedia }
spec:
  replicas: 2
  selector: { matchLabels: { app: tudimedia-media-worker } }
  template:
    metadata: { labels: { app: tudimedia-media-worker } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/blacksaverstream/tudimedia-api:latest
          command: ["node", "src/media-worker.js"]
          envFrom: [{ configMapRef: { name: tudimedia-config } }, { secretRef: { name: tudimedia-secrets } }]
          resources: { requests: { cpu: "1", memory: 1Gi }, limits: { cpu: "4", memory: 4Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-worker, namespace: tudimedia }
spec:
  replicas: 2
  selector: { matchLabels: { app: tudimedia-ai-worker } }
  template:
    metadata: { labels: { app: tudimedia-ai-worker } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/blacksaverstream/tudimedia-api:latest
          command: ["node", "src/ai-worker.js"]
          envFrom: [{ configMapRef: { name: tudimedia-config } }, { secretRef: { name: tudimedia-secrets } }]
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
